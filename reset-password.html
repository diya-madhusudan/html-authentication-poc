<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reset Password</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

<div class="card login-card p-4">

<h3 class="text-center mb-4">Reset Password</h3>

<form>

<div class="mb-3">

<label class="form-label">New Password</label>

<div class="input-group">

<input type="password" id="newPassword" class="form-control" required>

<span class="input-group-text" onclick="togglePassword('newPassword')">
<i class="bi bi-eye"></i>
</span>

</div>

</div>

<div class="mb-3">

<label class="form-label">Confirm Password</label>

<div class="input-group">

<input type="password" id="confirmPassword" class="form-control" required>

<span class="input-group-text" onclick="togglePassword('confirmPassword')">
<i class="bi bi-eye"></i>
</span>

</div>

</div>

<a href="index.html" class="btn btn-primary w-100">
Update Password
</a>

</form>

<div class="text-center mt-3">

<p><a href="index.html">Back to Login</a></p>

</div>

</div>

</div>

<script>

function togglePassword(id){

let pass=document.getElementById(id);

if(pass.type==="password"){
pass.type="text";
}else{
pass.type="password";
}

}

</script>

</body>
</html>
